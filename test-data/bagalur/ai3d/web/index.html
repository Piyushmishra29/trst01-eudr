<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0e1210">
<title>Bagalur 3D Relief</title>
<style>
  :root { --bg:#0e1210; --fg:#e8ece6; --mute:#a3ada5; --panel:rgba(14,18,16,.8); }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg); font:14px/1.4 -apple-system,system-ui,sans-serif; overflow:hidden; overscroll-behavior:none; }
  body { height:100dvh; }
  canvas { display:block; touch-action:none; -webkit-user-select:none; user-select:none; }
  #ui { position:fixed; left:max(12px,env(safe-area-inset-left)); top:max(12px,env(safe-area-inset-top)); width:min(320px,calc(100vw - 24px)); box-sizing:border-box;
        background:var(--panel); padding:10px 12px; border-radius:12px; -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px); }
  #ui header { display:flex; justify-content:space-between; align-items:center; gap:8px; }
  #ui h1 { font-size:15px; margin:0; }
  #toggle { background:none; border:0; color:var(--fg); font-size:18px; padding:4px 8px; cursor:pointer; }
  #ui.min .body { display:none; }
  #ui p { margin:6px 0 8px; color:var(--mute); font-size:12px; }
  #ui label { display:flex; gap:10px; align-items:center; font-size:13px; margin:8px 0; }
  #ui input[type=range] { flex:1; height:28px; }
  #views { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
  #views button { background:#26302a; color:var(--fg); border:0; border-radius:8px; padding:9px 11px; font-size:13px; cursor:pointer; }
  #views button.on { background:#3d6b4c; }
  .sw { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:6px; vertical-align:-1px; }
  .sw.drone { background:#ffd23f; } .sw.sat { background:#8a8f86; }
  #hint { position:fixed; bottom:max(14px,env(safe-area-inset-bottom)); left:0; right:0; text-align:center; color:var(--mute); font-size:12px; pointer-events:none; transition:opacity 1s; }
  #load { position:fixed; inset:0; display:grid; place-items:center; color:var(--mute); text-align:center; padding:20px; }
</style>
</head>
<body>
<div id="load">Loading 3D…</div>
<div id="ui">
  <header><h1>Bagalur: drone vs satellite</h1><button id="toggle" aria-label="Hide panel">–</button></header>
  <div class="body">
    <p><span class="sw drone"></span><b>Our drone</b>: 6 cm/px, one DJI Mini 3 Pro photo (350 m). Heights from AI depth estimation: illustrative, not measured.<br><span class="sw sat"></span><b>Satellite</b> (Esri World Imagery): about 50 cm/px, flat.</p>
    <label>Height <input id="ex" type="range" min="0" max="40" step="0.5" value="10"></label>
    <label>Sun <input id="sun" type="range" min="0" max="360" step="1" value="120"></label>
    <div id="views">
      <button data-v="oblique">Angled</button><button data-v="wide">Wide</button><button data-v="low">Low</button><button data-v="top">Top</button><button data-v="spin">Rotate</button><button data-v="hd" id="hdbtn">HD</button>
    </div>
  </div>
</div>
<div id="hint">Drag to orbit · pinch to zoom · two fingers to pan</div>
<script type="module">
import * as THREE from "./three.module.js";
import { OrbitControls } from "./OrbitControls.js";

const q = new URLSearchParams(location.search);
const touch = matchMedia("(pointer:coarse)").matches;
const small = Math.min(screen.width, screen.height) < 700 || Math.min(innerWidth, innerHeight) < 500;
const portrait = () => innerHeight > innerWidth;
let hd = q.has("hd") ? q.get("hd") !== "0" : !(touch || small);   // phones start light, HD on request

const renderer = new THREE.WebGLRenderer({ antialias: !touch, powerPreference: "high-performance" });
renderer.setPixelRatio(Math.min(devicePixelRatio, touch ? 2 : 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = touch ? THREE.PCFShadowMap : THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xbcd0dc);
scene.fog = new THREE.Fog(0xbcd0dc, 900, 2600);
const camera = new THREE.PerspectiveCamera(portrait() ? 55 : 40, innerWidth / innerHeight, 1, 6000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.maxPolarAngle = Math.PI * 0.47;
controls.minDistance = 40; controls.maxDistance = 2200;
controls.touches = { ONE: THREE.TOUCH.ROTATE, TWO: THREE.TOUCH.DOLLY_PAN };

scene.add(new THREE.HemisphereLight(0xffffff, 0x6b5a45, 1.6));
const sun = new THREE.DirectionalLight(0xfff1dc, 1.6);
sun.castShadow = true;
Object.assign(sun.shadow.camera, { left: -330, right: 330, top: 330, bottom: -330, near: 1, far: 1500 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.6;
scene.add(sun, sun.target);

const loadImg = src => new Promise((ok, err) => { const i = new Image(); i.onload = () => ok(i); i.onerror = err; i.src = src; });
const texLoader = new THREE.TextureLoader();
let mesh, geo, hts, ex = 10, sat, outline;
const AL = await (await fetch("align.json")).json();
const [SW, SH] = AL.sat_size, SPX = AL.sat_px_m, [DW, DH] = AL.drone_size, A = AL.A;
// drone pixel (u,v) -> world metres (x east, z south), origin = centre of the satellite block
const SEAM = await (await fetch("seam.json")).json();   // correction grid (satellite px) so roads meet the satellite cleanly
function seamAt(u, v) {   // bilinear sample of the grid at drone pixel (u, v)
  const fx = Math.min(Math.max(u / DW, 0), 1) * (SEAM.gx - 1), fy = Math.min(Math.max(v / DH, 0), 1) * (SEAM.gy - 1);
  const x0 = Math.min(Math.floor(fx), SEAM.gx - 2), y0 = Math.min(Math.floor(fy), SEAM.gy - 2), tx = fx - x0, ty = fy - y0, d = SEAM.d;
  const l = (k) => (d[y0][x0][k] * (1 - tx) + d[y0][x0 + 1][k] * tx) * (1 - ty) + (d[y0 + 1][x0][k] * (1 - tx) + d[y0 + 1][x0 + 1][k] * tx) * ty;
  return [l(0), l(1)];
}
const toWorld = (u, v) => {
  const [dx, dy] = seamAt(u, v);
  const X = A[0][0] * u + A[0][1] * v + A[0][2] + dx, Y = A[1][0] * u + A[1][1] * v + A[1][2] + dy;
  return [(X - SW / 2) * SPX, (Y - SH / 2) * SPX];
};
const corners = [[0, 0], [DW, 0], [DW, DH], [0, DH]].map(([u, v]) => toWorld(u, v));
const edgePts = [];
for (const [[au, av], [bu, bv]] of [[[0, 0], [DW, 0]], [[DW, 0], [DW, DH]], [[DW, DH], [0, DH]], [[0, DH], [0, 0]]])
  for (let i = 0; i < 24; i++) edgePts.push(toWorld(au + (bu - au) * i / 24, av + (bv - av) * i / 24));
const CX = corners.reduce((a, c) => a + c[0], 0) / 4, CZ = corners.reduce((a, c) => a + c[1], 0) / 4;

async function build() {
  const tag = hd ? "hd" : "sd";
  const [hImg, tex, stex] = await Promise.all([loadImg(`height_${tag}.png`), texLoader.loadAsync(`tex_${tag}.jpg`), texLoader.loadAsync(`sat_${tag}.jpg`)]);
  tex.colorSpace = stex.colorSpace = THREE.SRGBColorSpace;
  stex.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
  if (sat) { scene.remove(sat); sat.geometry.dispose(); sat.material.map.dispose(); sat.material.dispose(); }
  sat = new THREE.Mesh(new THREE.PlaneGeometry(SW * SPX, SH * SPX).rotateX(-Math.PI / 2),
                       new THREE.MeshStandardMaterial({ map: stex, color: 0xc9cbc6, roughness: 1 }));   // slightly muted so the drone area pops
  sat.position.y = -0.4; sat.receiveShadow = true; scene.add(sat);
  tex.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
  const c = document.createElement("canvas"); c.width = hImg.width; c.height = hImg.height;
  const cx = c.getContext("2d", { willReadFrequently: true }); cx.drawImage(hImg, 0, 0);
  const px = cx.getImageData(0, 0, c.width, c.height).data;
  const n = c.width * c.height; hts = new Float32Array(n);
  for (let i = 0; i < n; i++) hts[i] = (px[i * 4] * 256 + px[i * 4 + 1]) / 65535;
  if (mesh) { scene.remove(mesh); mesh.geometry.dispose(); mesh.material.map.dispose(); mesh.material.dispose(); }
  geo = new THREE.PlaneGeometry(1, 1, c.width - 1, c.height - 1);
  const gp = geo.attributes.position, gx = c.width - 1, gy = c.height - 1;
  for (let iy = 0; iy <= gy; iy++) for (let ix = 0; ix <= gx; ix++) {
    const [x, z] = toWorld(ix / gx * DW, iy / gy * DH); gp.setXYZ(iy * (gx + 1) + ix, x, 0, z);
  }
  mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ map: tex, roughness: 0.95, metalness: 0 }));
  mesh.castShadow = mesh.receiveShadow = true;
  scene.add(mesh);
  applyHeights();
  if (!outline) addOutline();
  const sm = hd ? 4096 : 2048;
  if (sun.shadow.mapSize.x !== sm) { sun.shadow.mapSize.set(sm, sm); sun.shadow.map?.dispose(); sun.shadow.map = null; }
  document.getElementById("hdbtn").classList.toggle("on", hd);
}
function addOutline() {   // 1 px yellow line around the mapped area, sharp at any zoom
  const g = new THREE.BufferGeometry().setFromPoints(edgePts.map(([x, z]) => new THREE.Vector3(x, 0.6, z)));
  outline = new THREE.LineLoop(g, new THREE.LineBasicMaterial({ color: 0xffd23f, fog: false, depthTest: false, transparent: true, opacity: 0.9 }));
  outline.renderOrder = 10; scene.add(outline);
}
function applyHeights() {
  const pos = geo.attributes.position;
  for (let i = 0; i < pos.count; i++) pos.setY(i, hts[i] * ex);
  pos.needsUpdate = true; geo.computeVertexNormals();
}
function setSun(deg) { const r = THREE.MathUtils.degToRad(deg); sun.position.set(CX + Math.cos(r) * 300, 260, CZ + Math.sin(r) * 300); sun.target.position.set(CX, 0, CZ); }

const views = {           // offsets from the drone-area centre, metres
  oblique: [[-200, 330, 470], [0, 0, 20]],
  wide:    [[-380, 900, 1150], [0, 0, 60]],
  low:     [[210, 75, 300], [-30, 0, -10]],
  top:     [[0, 760, 1], [0, 0, 0]],
};
function go(v) {
  const [p, t] = views[v]; const k = portrait() ? 1.6 : 1;  // portrait phones: step back a little so the farm fits
  const fk = k * (v === 'top' ? 1.6 : v === 'wide' ? 2 : 1); scene.fog.near = 900 * fk; scene.fog.far = 2600 * fk;
  camera.position.set(CX + p[0] * k, p[1] * k, CZ + p[2] * k); controls.target.set(CX + t[0], t[1], CZ + t[2]); controls.update();
}

try {
  await build();
} catch (e) {
  document.getElementById("load").textContent = "Couldn't load the 3D model on this device. Try the HD button off, or open on a computer.";
  throw e;
}
setSun(120);
go(q.get("view") || "oblique");

let pending = false;
document.getElementById("ex").addEventListener("input", e => {
  ex = +e.target.value;
  if (!pending) { pending = true; requestAnimationFrame(() => { applyHeights(); pending = false; }); }
});
document.getElementById("sun").addEventListener("input", e => setSun(+e.target.value));
document.getElementById("views").addEventListener("click", async e => {
  const v = e.target.dataset.v; if (!v) return;
  if (v === "spin") { controls.autoRotate = !controls.autoRotate; controls.autoRotateSpeed = 0.8; e.target.classList.toggle("on", controls.autoRotate); }
  else if (v === "hd") { hd = !hd; e.target.textContent = "Loading…"; await build(); e.target.textContent = "HD"; }
  else go(v);
});
const ui = document.getElementById("ui");
document.getElementById("toggle").addEventListener("click", () => {
  ui.classList.toggle("min"); document.getElementById("toggle").textContent = ui.classList.contains("min") ? "+" : "–";
});
if (small) ui.classList.add("min"), document.getElementById("toggle").textContent = "+";
function resize() {
  camera.aspect = innerWidth / innerHeight; camera.fov = portrait() ? 55 : 40; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight);
}
addEventListener("resize", resize);
addEventListener("orientationchange", () => setTimeout(resize, 200));
document.getElementById("load").remove();
setTimeout(() => document.getElementById("hint").style.opacity = 0, 5000);

// render only while something moves: saves battery and keeps phones cool
let dirty = true, idle = 0;
controls.addEventListener("change", () => { dirty = true; });
["input", "click", "resize"].forEach(t => addEventListener(t, () => { dirty = true; }, true));
document.addEventListener("visibilitychange", () => { dirty = true; });
window.__ready = true;
renderer.setAnimationLoop(() => {
  const moving = controls.update();
  if (moving || controls.autoRotate) dirty = true;
  if (dirty) { renderer.render(scene, camera); dirty = false; idle = 0; }
  else if (++idle > 2 && document.hidden) return;
});
</script>
</body>
</html>
